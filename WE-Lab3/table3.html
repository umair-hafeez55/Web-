<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seminar Schedule Table</title>
</head>
<body>

    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <!-- Row 1: Main headers -->
            <tr>
                <th rowspan="3">Day</th>
                <th colspan="3">Seminar</th>
            </tr>
            <!-- Row 2: Sub-headers -->
            <tr>
                <th colspan="2">Schedule</th>
                <th rowspan="2">Topic</th>
            </tr>
            <!-- Row 3: Schedule breakdown -->
            <tr>
                <th>Begin</th>
                <th>End</th>
            </tr>
        </thead>
        <tbody>
            <!-- Row 4: Monday Data -->
            <tr>
                <td>Monday</td>
                <td>8:00 a.m.</td>
                <td>5:00 p.m.</td>
                <td>Introduction to XML</td>
            </tr>
            <!-- Row 5: Tuesday Data -->
            <tr>
                <td>Tuesday</td>
                <td>8:00 a.m.</td>
                <td>11:00 a.m.</td>
                <td>Intro to XMF</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
