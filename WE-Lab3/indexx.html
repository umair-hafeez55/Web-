<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Novell Services Login</h1>
   <form action="">

    <table>
        <tr>
            <td>Username</td>
            <td><input type="text" placeholder="Username"></td>
        </tr>
        <tr>
            <td>Password</td>
            <td><input type="password" placeholder="Password"></td>
        </tr>
        <tr>
            <td>City of <br> Employment</td>
            <td><input type="text" placeholder="City"></td>
        </tr>

        <tr>
            <td>Web Server</td>
            <td>
                <select name="Web Server">
                <option value="">- Choose a server -</option>
                <option value="apache">Apache Web Server</option>
                <option value="nginx">Nginx Web Server</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Please Specify <br> your role:</td>
            <td>
                <input type="radio" name="role"> Admin <br>
                <input type="radio" name="role"> Engineer <br>
                <input type="radio" name="role"> Manager <br>
                <input type="radio" name="role"> Guest <br>
            </td>
        </tr>

        <tr>
            <td>Single Sign-on <br>to the following:</td>
            <td>
                <input type="checkbox" name="mail"> Mail <br>
                <input type="checkbox" name="payroll"> Payroll <br>
                <input type="checkbox" name="selfservice"> Self Service <br>
            </td>
        </tr>

        <tr>
            <td></td>
            <td>
                <input type="submit" placeholder="Submit">
            </td>
        </tr>
        
    </table>
   </form>
</body>
</html>
